def add_10_shared_tile_tensor[
    Engine: TensorEngine,
](
    output: TileTensor[
        mut=True, dtype, LayoutType, MutAnyOrigin, Engine=Engine
    ],
    a: TileTensor[mut=False, dtype, LayoutType, ImmutAnyOrigin, Engine=Engine],
    size_dev: Int32,
) where (Engine.element_size == 1):
    var size = Int(size_dev)
    # Allocate shared memory. Unlike most kernel variables, which are private to
    # each thread, shared memory (\`AddressSpace.SHARED\`) is scoped per-block.
    # So, each thread in a block can use the same "scratchpad" to store data.
    var shared = stack_allocation[dtype=dtype, address_space=.SHARED](
        row_major[TPB]()
    )

    var global_i = block_dim.x * block_idx.x + thread_idx.x
    var local_i = thread_idx.x

    if global_i < size:
        shared[local_i] = rebind[Scalar[dtype]](a[global_i])

    # Note: barrier is not strictly needed here since each thread only accesses
    # its own shared memory location. However, it's included to teach proper
    # shared memory synchronization patterns for more complex scenarios where
    # threads need to coordinate access to shared data.
    barrier()

    if global_i < size:
        output[global_i] = shared[local_i] + 10.0

# Each thread reads its right neighbour's shared slot.
# Toggle the barrier() line to see the race appear and disappear.
def rotate_shared[
    Engine: TensorEngine,
](
    output: TileTensor[mut=True, dtype, LayoutType, MutAnyOrigin, Engine=Engine],
    a: TileTensor[mut=False, dtype, LayoutType, ImmutAnyOrigin, Engine=Engine],
    size_dev: Int32,
) where (Engine.element_size == 1):
    var size = Int(size_dev)
    var shared = stack_allocation[dtype=dtype, address_space=.SHARED](
        row_major[TPB]()
    )
    var global_i = block_dim.x * block_idx.x + thread_idx.x
    var local_i = thread_idx.x
    if global_i < size:
        shared[local_i] = a[global_i] * 2.0
    # barrier()
    if global_i < size:
        var neighbour = (local_i + 1) % TPB
        output[global_i] = shared[neighbour]
